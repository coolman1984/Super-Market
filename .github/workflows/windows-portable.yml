name: windows-portable
# Builds the no-install Windows package on a real Windows runner and proves it
# starts with ONLY the bundled Python: no installed Python on PATH, no packages.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and integration tests on Windows
        run: python tools/ci_tests.py
      - name: Cloud sync Worker (real worker code, local D1 stand-in)
        working-directory: cloud
        run: npm test
      - name: PowerShell tools - parse, read-only inventory, Excel tool without Office
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem tools\*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | Format-List; throw "syntax errors in $($f.Name)" }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Discover-Environment.ps1
          if (-not (Test-Path ENVIRONMENT_REPORT.local.json)) { throw 'inventory not written' }
          $r = Get-Content ENVIRONMENT_REPORT.local.json -Raw | ConvertFrom-Json
          "os=$($r.os) ps=$($r.powershell) writable=$($r.program_folder_writable) excel=$($r.office_com_registered.'Excel.Application') printers=$(@($r.printers).Count) serial=$(@($r.serial_ports).Count)"
          if (-not $r.office_com_registered.'Excel.Application') {
            $p = Start-Process -FilePath powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','tools\Read-ExcelViaCom.ps1','-Path','README.md','-Out','x.csv' -Wait -PassThru -NoNewWindow
            "excel tool exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 3) { throw "expected a clear 'Excel missing' exit 3, got $($p.ExitCode)" }
          }
          $global:LASTEXITCODE = 0
      - name: Frontend audit checks (R16 R17 R18)
        run: node tests/ui/audit_ui.js
      - name: Install build-only browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Rendered journeys on Windows
        shell: bash
        env:
          SM_CLOUD_URL: "off"
        run: bash tests/ui/run.sh windows-browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-evidence
          path: windows-browser-evidence
          retention-days: 14
      - name: Build portable package (pinned Python from NuGet, SHA-512 checked)
        run: python tools/build_portable.py --out dist
      - name: Start the package with its own Python only
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\SuperMarket-*-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:\clean
          $app = Get-ChildItem C:\clean -Directory | Select-Object -First 1
          # hide every other Python from this step
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python|hostedtoolcache' }) -join ';'
          $env:PYTHONPATH = 'C:\nonexistent'; $env:PYTHONHOME = 'C:\nonexistent'
          & "$($app.FullName)\python\python.exe" -c "import sys, sqlite3, ctypes, ssl, hashlib; print(sys.version, sqlite3.sqlite_version, sys.path)"
          if ($LASTEXITCODE -ne 0) { throw 'bundled python failed' }
          $p = Start-Process -FilePath "$($app.FullName)\python\python.exe" -ArgumentList '-X','utf8','launcher.py','training' -WorkingDirectory $app.FullName -PassThru
          Start-Sleep -Seconds 6
          $state = Invoke-RestMethod http://127.0.0.1:8766/api/state
          $state | ConvertTo-Json
          if ($state.mode -ne 'training') { throw 'server did not answer' }
          $css = Invoke-WebRequest http://127.0.0.1:8766/css/shop.css -UseBasicParsing
          if ($css.StatusCode -ne 200) { throw 'static files missing' }
          & "$($app.FullName)\python\python.exe" "$($app.FullName)\tools\shopctl.py" backup --data "$($app.FullName)\training-data" --mode training
          if ($LASTEXITCODE -ne 0) { throw 'backup failed' }
          Get-ChildItem "$($app.FullName)\backups-training"
          Stop-Process -Id $p.Id
          & "$($app.FullName)\python\python.exe" -c "import sys; sys.path.insert(0, r'$($app.FullName)'); from server.scanner import list_serial_ports; print('serial ports:', list_serial_ports())"
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota (billing) must not hide the real test result
        with:
          name: SuperMarket-win64
          path: |
            dist/SuperMarket-*-win64.zip
            dist/SuperMarket-*-win64.zip.sha256
          retention-days: 7

  # The installed program, built like the Yousef app: compiled SuperMarket.exe (no readable source),
  # its own window, SuperMarket-Setup.exe. A NON-CUSTOMER test build (own AppId and folder).
  windows-installer:
    needs: test-and-build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SM_CLOUD_URL: "off"     # a test machine must never take a space on the owner's real cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build tools (build machine only; the customer's PC needs none)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.5,<3" ordered-set zstandard
          choco upgrade innosetup -y --no-progress
      - name: Build the test installer
        env:
          TO_BUILD_CHANNEL: ci-test
        run: python tools/build_windows.py
      - name: The built program starts, serves its pages and stops cleanly
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'sm-built'
          python tools/journey_exe.py first $h build\launcher.dist\SuperMarket.exe
          if ($LASTEXITCODE -ne 0) { throw 'the built program failed the journey' }
      - name: Install silently, check the data folder protection, journey, update over it, uninstall keeps the data
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/SuperMarket-Setup-*.exe | Select-Object -First 1
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          $exe = Join-Path ${env:ProgramFiles} 'SuperMarket-CITest\SuperMarket.exe'
          if (-not (Test-Path $exe)) { throw 'the installed program is missing' }
          $leaks = Get-ChildItem (Split-Path $exe) -Recurse -Include *.py,*.pyc | Select-Object -First 5
          if ($leaks) { $leaks; throw 'readable program source in the installed folder' }
          $acl = (icacls (Join-Path ${env:ProgramData} 'SuperMarket')) -join "`n"
          Write-Host $acl
          if ($acl -match 'BUILTIN\\Users' -or $acl -match 'Authenticated Users' -or $acl -match 'Everyone') { throw 'the data folder is open to other Windows accounts' }
          $me = (whoami)
          if ($acl -notmatch [regex]::Escape($me)) { throw "the operator account $me did not get access to the data folder" }
          # the real, protected data folder - no SM_HOME override (review on PR #13)
          $h = 'installed'
          python tools/journey_exe.py first $h $exe
          if ($LASTEXITCODE -ne 0) { throw 'the first journey failed' }
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          python tools/journey_exe.py after $h $exe
          if ($LASTEXITCODE -ne 0) { throw 'the shop did not survive the update' }
          $un = Get-ChildItem (Join-Path ${env:ProgramFiles} 'SuperMarket-CITest') -Filter 'unins*.exe' | Select-Object -First 1
          (Start-Process -FilePath $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'uninstall left the program behind' }
          if (-not (Test-Path (Join-Path ${env:ProgramData} 'SuperMarket'))) { throw 'uninstall removed the data folder' }
          if (-not (Test-Path (Join-Path ${env:ProgramData} 'SuperMarket\shop-data\shop.db'))) { throw 'uninstall removed the shop data' }
          Write-Host 'installed, journeyed, updated, uninstalled: the data stayed'
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # a full artifact quota must not hide the real test result
        with:
          name: SuperMarket-Setup-CI-TEST-NOT-FOR-CUSTOMERS
          path: |
            dist/SuperMarket-Setup-*.exe
            dist/CI-TEST-BUILD-NOT-FOR-CUSTOMERS.txt
          retention-days: 7
