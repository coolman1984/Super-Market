name: release
# A tag `vX.Y.Z` builds the customer installer on a real Windows machine and attaches it to a DRAFT GitHub Release
# (the owner publishes it himself after trying it). Required repository secret: SM_ENROLL_TOKEN (the cloud build
# token; docs/RELEASE.md). Commercial versions also require SM_SIGN_PFX_BASE64 + SM_SIGN_PFX_PASSWORD.
# SIG-02: a commercial version (anything other than exactly N.N.N-pilot) fails closed when the signing
# secrets are missing or the installer is not Authenticode-signed (signtool verify /pa and
# Get-AuthenticodeSignature Status Valid). N.N.N-pilot is the only unsigned path: sign and verify are
# skipped, and a tag of that version is a draft prerelease whose notes say SmartScreen will warn.
# workflow_dispatch creates no GitHub Release; it uses the same pilot rule from server/version.py.
# The CI-TEST installer is windows-portable.yml and is not this job.
on:
  push:
    tags: ["v*"]
    branches: ["main", "codex/windows-hardware-*"]
    paths: ["server/version.py", ".github/workflows/release.yml"]
  workflow_dispatch:        # dry run: no GitHub Release; sign+verify run unless VERSION is exactly N.N.N-pilot

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SM_CLOUD_URL: "off"                       # tests and journeys on this runner never take a cloud space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The tag matches the program's version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from server.version import VERSION; print(VERSION)"
          Write-Host "program version: $v, ref: $env:GITHUB_REF_NAME"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "tag $env:GITHUB_REF_NAME does not match server/version.py ($v)" }
          $pilot = ($v -match '^\d+\.\d+\.\d+-pilot$');
          "pilot=$($pilot.ToString().ToLower())" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          Write-Host "SIG-02 pilot=$($pilot.ToString().ToLower())"
      - name: All tests
        run: python tools/ci_tests.py
      - name: Cloud Worker tests
        working-directory: cloud
        run: npm test
      - name: Frontend audit checks
        run: node tests/ui/audit_ui.js
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.5,<3" ordered-set zstandard
          choco upgrade innosetup -y --no-progress
      - name: Build the customer installer (carries the cloud build token)
        env:
          SM_ENROLL_TOKEN: ${{ secrets.SM_ENROLL_TOKEN }}
          TO_BUILD_CHANNEL: commercial
        run: python tools/build_windows.py
      - name: The built program starts, serves its pages and stops cleanly
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'sm-built'
          python tools/journey_exe.py first $h build\launcher.dist\SuperMarket.exe
          if ($LASTEXITCODE -ne 0) { throw 'the built program failed the journey' }
      - name: Sign the customer installer (fails when the certificate secrets are missing)
        if: steps.ver.outputs.pilot != 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.SM_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SM_SIGN_PFX_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:PFX) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host '::error::SIG-02: commercial release refused. Repository secrets SM_SIGN_PFX_BASE64 and SM_SIGN_PFX_PASSWORD are not both set. An unsigned customer installer must not be published. Add the code-signing certificate secrets (docs/RELEASE.md) and rerun. This failure is on purpose.'
            throw 'SIG-02: no code-signing certificate configured; refusing an unsigned customer installer (SuperMarket-Setup).'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          try {
            try {
              $bytes = [Convert]::FromBase64String($env:PFX.Trim())
            } catch {
              Write-Host '::error::SIG-02: SM_SIGN_PFX_BASE64 is not valid base64. Refusing to publish an unsigned customer installer.'
              throw 'SIG-02: signing certificate secret is not valid base64.'
            }
            if (-not $bytes -or $bytes.Length -lt 1) {
              Write-Host '::error::SIG-02: SM_SIGN_PFX_BASE64 decoded to an empty certificate. Refusing to publish an unsigned customer installer.'
              throw 'SIG-02: signing certificate secret is empty.'
            }
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $installers = @(Get-ChildItem dist\SuperMarket-Setup-*.exe -ErrorAction SilentlyContinue)
            if ($installers.Count -lt 1) {
              Write-Host '::error::SIG-02: no customer installer dist\SuperMarket-Setup-*.exe to sign.'
              throw 'SIG-02: customer installer is missing; refusing to continue unsigned.'
            }
            foreach ($file in $installers) {
              if ($file.Name -like '*CI-TEST*') {
                Write-Host "::error::SIG-02: $($file.Name) is a CI-TEST installer. This job only publishes the customer installer, and it must be Authenticode-signed."
                throw "SIG-02: refusing CI-TEST file $($file.Name) in the commercial release."
              }
            }
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
            if (-not $signtool) {
              Write-Host '::error::SIG-02: signtool.exe was not found. Cannot sign the customer installer.'
              throw 'SIG-02: signtool.exe is missing; signature check failed closed.'
            }
            foreach ($file in $installers) {
              & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::SIG-02: signtool sign failed for $($file.Name). The customer installer is not signed."
                throw "SIG-02: signing failed for $($file.Name)."
              }
            }
          } finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }
      - name: Verify the Authenticode signature (SIG-02)
        if: steps.ver.outputs.pilot != 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $installers = @(Get-ChildItem dist\SuperMarket-Setup-*.exe -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) {
            Write-Host '::error::SIG-02: no customer installer dist\SuperMarket-Setup-*.exe to verify. An unsigned release must not continue.'
            throw 'SIG-02: customer installer is missing; cannot verify Authenticode.'
          }
          foreach ($file in $installers) {
            if ($file.Name -like '*CI-TEST*') {
              Write-Host "::error::SIG-02: $($file.Name) is a CI-TEST installer. This commercial job refuses it."
              throw "SIG-02: refusing CI-TEST file $($file.Name) in the commercial release."
            }
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          if (-not $signtool) {
            Write-Host '::error::SIG-02: signtool.exe was not found. Cannot verify the Authenticode signature.'
            throw 'SIG-02: signtool.exe is missing; signature verification failed closed.'
          }
          foreach ($file in $installers) {
            & $signtool.FullName verify /pa $file.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::SIG-02: signtool verify /pa failed for $($file.Name). The customer installer is not Authenticode-signed."
              throw "SIG-02: signtool verify /pa failed for $($file.Name)."
            }
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            $status = $sig.Status.ToString()
            if ($status -ne 'Valid') {
              Write-Host "::error::SIG-02: Get-AuthenticodeSignature status is $status for $($file.Name); expected Valid. Refusing an unsigned or invalid customer installer."
              throw "SIG-02: Authenticode status is $status for $($file.Name); expected Valid."
            }
            Write-Host "SIG-02: $($file.Name) Authenticode status Valid (signtool verify /pa passed)."
          }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\SuperMarket-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt
      - name: Silent install, first journey on the installed program, uninstall keeps the data
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/SuperMarket-Setup-*.exe | Select-Object -First 1
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          $exe = Join-Path ${env:ProgramFiles} 'SuperMarket\SuperMarket.exe'
          if (-not (Test-Path $exe)) { throw 'the installed program is missing' }
          python tools/journey_exe.py first installed $exe
          if ($LASTEXITCODE -ne 0) { throw 'the installed program failed the journey' }
          $un = Get-ChildItem (Join-Path ${env:ProgramFiles} 'SuperMarket') -Filter 'unins*.exe' | Select-Object -First 1
          (Start-Process -FilePath $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SuperMarket-Setup
          path: |
            dist/SuperMarket-Setup-*.exe
            dist/SHA256SUMS.txt
          retention-days: 30
      - name: Draft GitHub Release with the installer (the owner publishes it)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT: ${{ steps.ver.outputs.pilot }}
        run: |
          if ($env:PILOT -eq 'true') {
            $notes = "UNSIGNED pilot of Super Market $env:GITHUB_REF_NAME.`n`nThis installer is not Authenticode-signed. Windows SmartScreen will warn on first download.`n`nDownload SuperMarket-Setup-*.exe, run it, open Super Market and sell: the program connects to its cloud copy by itself.`nSHA-256 checksums are in SHA256SUMS.txt.`nDraft prerelease: not a commercial customer build. The owner publishes it after a trial installation."
            $notes | Out-File -Encoding utf8 release-notes.md
            gh release create $env:GITHUB_REF_NAME --draft --prerelease --verify-tag --title "Super Market $env:GITHUB_REF_NAME" --notes-file release-notes.md (Get-ChildItem dist\SuperMarket-Setup-*.exe).FullName dist\SHA256SUMS.txt
          } else {
            $notes = "Customer installer of Super Market $env:GITHUB_REF_NAME.`n`nDownload SuperMarket-Setup-*.exe, run it, open Super Market and sell: the program connects to its cloud copy by itself.`nSHA-256 checksums are in SHA256SUMS.txt.`nDraft: published by the owner after a trial installation."
            $notes | Out-File -Encoding utf8 release-notes.md
            gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Super Market $env:GITHUB_REF_NAME" --notes-file release-notes.md (Get-ChildItem dist\SuperMarket-Setup-*.exe).FullName dist\SHA256SUMS.txt
          }
