name: browser-review
on:
  push:
    branches: ['codex/review-market-guide-20261031c']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SM_CLOUD_URL: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build-only browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Server acceptance tests
        run: python tools/ci_tests.py
      - name: Rendered user journeys and guide
        run: sh tests/ui/run.sh /tmp/review-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-evidence
          path: /tmp/review-shots
