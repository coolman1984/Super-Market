name = "super-market-backup"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "super-market-backup"
database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "super-market-backups"

[triggers]
crons = ["23 2 * * *"]

# Secret (never written in this file):
#   npx wrangler secret put MASTER_KEY   # ONCE, a long random value. It derives every PC's secret.
#                                        # Never print it, never change it: every connected PC would be locked out.
